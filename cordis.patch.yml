# dsh-readable-diagrams bundle patch: installing the package (the Plugins page, or
# `dsh plugin --profile <name> add <spec>`) adds it to the profile's bundles, and
# this layer mounts its one plugin row, which registers the readable-diagrams
# skill with the profile's skill registry.
- insert:
    - id: readable-diagrams
      name: dsh-readable-diagrams
