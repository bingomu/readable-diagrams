<!DOCTYPE html>
<!-- readable-diagrams · manual authoring template (light).
     Copy this file, replace the {placeholders} and the SVG body, then run:
       python3 scripts/self_check.py your.html
       python3 scripts/comprehension_check.py your.html
     Keep the page furniture: it is what makes the figure readable. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{TITLE}</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f5f5; --paper-2:#ececec; --ink:#2d3142; --muted:#4f5d75;
  --soft:#5a6580; --rule:rgba(45,49,66,0.12); --accent:#bf4520; --accent-tint:rgba(191,69,32,0.08);
  --link:#2e5aa8; --doc-w:1080px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Geist', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.rd-doc{max-width:var(--doc-w,1080px);margin:0 auto;padding:64px 40px 80px}
.rd-eyebrow{font-family:'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, 'PingFang SC', monospace;font-size:11px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
.rd-title{font-family:'Instrument Serif', 'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif;font-weight:400;font-size:clamp(26px,3.4vw,42px);
  line-height:1.16;letter-spacing:-.005em;margin:12px 0 0;max-width:26ch;
  text-wrap:balance}
.rd-takeaway{margin:16px 0 0;max-width:66ch;font-size:17px;line-height:1.65;color:var(--muted)}
.rd-takeaway strong{color:var(--ink);font-weight:600}
.rd-figure{margin:36px 0 0}
.rd-canvas{width:100%;overflow-x:auto;padding-bottom:4px}
.rd-canvas svg{width:100%;min-width:960px;height:auto;display:block}
.rd-caption{margin:14px 0 0;font-size:13px;line-height:1.6;color:var(--soft);max-width:70ch}
.rd-steps{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:10px;
  border-top:1px solid var(--rule);padding-top:20px}
.rd-steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.rd-steps .n{display:flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:11px;font-weight:600;margin-top:2px}
.rd-steps .t{font-weight:600;font-size:14px}
.rd-steps .d{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:1px}
.rd-legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin:26px 0 0;
  padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.rd-legend li{display:inline-flex;align-items:center;gap:7px;list-style:none}
.rd-legend ul{display:contents}
.rd-swatch{width:14px;height:10px;border-radius:2px;display:inline-block}
.rd-footer{margin:34px 0 0;padding-top:14px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, 'PingFang SC', monospace;font-size:11px;
  color:var(--soft);letter-spacing:.04em}
.rd-footer .dot{opacity:.5}
@media print{
  body{background:#fff}
  .rd-doc{padding:24px 0}
  .rd-canvas{overflow-x:visible}
  .rd-canvas svg{min-width:0}
}
@media (max-width:640px){
  .rd-doc{padding:40px 20px 56px}
  .rd-title{font-size:26px}
}
</style>
</head>
<body class="rd-light">
<main class="rd-doc" data-rd-doc="1">
  <div class="rd-eyebrow">{TYPE} · {EYEBROW}</div>
  <h1 class="rd-title">{TITLE — state the conclusion, ≤ 60 chars}</h1>
  <p class="rd-takeaway">{TAKEAWAY — one sentence the reader must leave with}</p>
  <figure class="rd-figure">
    <div class="rd-canvas">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"
           aria-labelledby="demo-title demo-desc" data-rd-type="{type}">
        <title id="demo-title">{SHORT NAME OF THE SUBJECT}</title>
        <desc id="demo-desc">{ONE SENTENCE ABOUT THE CONTENT, NOT THE GEOMETRY}</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="960" height="600" fill="#f5f5f5"/>
        <!-- diagram markup goes here. Reference colour/font tokens by role, then resolve:
             paper #f5f5f5 · ink #2d3142 · muted #4f5d75 · soft #5a6580
             accent #bf4520 · accent-tint rgba(191,69,32,0.08) · link #2e5aa8 -->
        <g data-rd-node="1" data-rd-kind="backend">
          <rect x="80" y="120" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142"/>
          <text x="180" y="146" fill="#2d3142" font-size="12" font-weight="600"
                font-family="'Geist', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif" text-anchor="middle" data-role="name">Node name</text>
          <text x="180" y="162" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, 'PingFang SC', monospace"
                text-anchor="middle" data-role="sublabel">tech:port</text>
        </g>
      </svg>
    </div>
    <figcaption class="rd-caption">{CAPTION — say how to read it: direction, units, what is illustrative}</figcaption>
  </figure>
  <ol class="rd-steps" data-rd-steps="2">
    <li><span class="n">1</span><span><span class="t">{STEP 1 TITLE}</span><span class="d">{what to look at}</span></span></li>
    <li><span class="n">2</span><span><span class="t">{STEP 2 TITLE}</span><span class="d">{what to look at}</span></span></li>
  </ol>
  <ul class="rd-legend" data-rd-legend="1">
    <li><span class="rd-swatch" style="background:#2d3142"></span>{service}</li>
    <li><span class="rd-swatch" style="background:#bf4520"></span>{primary path}</li>
  </ul>
  <footer class="rd-footer"><span>{TYPE}</span><span class="dot">·</span><span>fit</span><span class="dot">·</span><span>{audience}</span></footer>
</main>
</body>
</html>
